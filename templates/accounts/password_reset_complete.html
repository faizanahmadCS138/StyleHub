{% extends "base.html" %}
{% load static %}

{% block title %}Password Reset Complete — StyleHub{% endblock %}

{% block content %}
<div class="auth-split-container">
    <!-- Left Column: Ambient Store Interior Image -->
    <div class="auth-image-col">
        <img src="{% static 'images/store_interior.png' %}" alt="StyleHub Store Interior">
    </div>

    <!-- Right Column: Password Reset Success -->
    <div class="auth-form-col" style="text-align: center;">
        <i class="fa-regular fa-circle-check" style="font-size: 52px; color: #2e7d32; margin-bottom: 20px;"></i>
        <h1 class="auth-heading">PASSWORD RESET COMPLETE</h1>
        
        <p style="font-size: 15px; color: #444; line-height: 1.6; margin-bottom: 40px;">
            Your password has been reset successfully! You can now sign in with your new password.
        </p>

        <a href="{% url 'accounts:login' %}" class="btn-auth-submit" style="display: block; text-align: center; text-decoration: none;">SIGN IN NOW</a>
    </div>
</div>
{% endblock %}
